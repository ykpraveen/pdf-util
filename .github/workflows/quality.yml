name: Fallow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallow:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Fallow audit
        run: npx fallow audit --base origin/main